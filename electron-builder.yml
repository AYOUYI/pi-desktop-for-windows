appId: com.pidesktopforwindows.app
productName: Pi Desktop
copyright: Copyright © 2026 pi-desktop contributors

# 自动更新：electron-updater 从对应 GitHub Releases 读取 latest.yml
publish:
  provider: github
  owner: AYOUYI
  repo: pi-desktop-for-windows

directories:
  output: release
  buildResources: build

files:
  - out/**
  - build/icon.png
  - package.json

extraResources:
  - from: build/icon.png
    to: icon.png

# pi SDK 是纯 JS，保持 asar 打包即可
asar: true

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Pi Desktop
  # 安装包文件名不带空格，避免 CI 上传 glob 匹配问题
  artifactName: Pi.Desktop.Setup.${version}.${ext}

# 国内网络走镜像拉取 Electron 运行时
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
